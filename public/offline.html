<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — CaliphateMakhtaba</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a1628;
      color: #faf6ef;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .card {
      max-width: 360px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(212,144,15,0.3);
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
    }
    .arabic {
      font-size: 2rem;
      color: #f5c842;
      margin-bottom: 0.5rem;
      font-family: serif;
    }
    h1 { font-size: 1.25rem; color: #faf6ef; margin-bottom: 0.75rem; font-weight: 500; }
    p  { font-size: 0.875rem; color: rgba(250,246,239,0.55); line-height: 1.6; margin-bottom: 1.5rem; }
    button {
      background: linear-gradient(135deg, #d4900f, #a06b08);
      color: white;
      border: none;
      border-radius: 0.75rem;
      padding: 0.75rem 2rem;
      font-size: 0.875rem;
      cursor: pointer;
      font-weight: 500;
    }
    button:hover { opacity: 0.9; }
    .rule { width: 60px; height: 1px; background: linear-gradient(90deg, transparent, #d4900f, transparent); margin: 1rem auto; }
  </style>
</head>
<body>
  <div class="card">
    <p class="arabic">مكتبة الخلافة</p>
    <div class="rule"></div>
    <h1>You're Offline</h1>
    <p>
      It looks like you've lost your internet connection.
      Previously visited pages may still be available from the cache.
    </p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
